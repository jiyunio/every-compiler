<!doctype html>
<html lang="ko" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="코드에 집중하는 온라인 Java 편집기"><title>every compiler — 온라인 Java 편집기</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23376d52'/%3E%3Ctext x='8' y='28' font-size='25' fill='white'%3EE%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><a class="brand" href="./"><span class="brand-icon">E<span>›</span></span>every<span class="brand-light">compiler</span><span class="beta">WORKSPACE</span></a><div class="top-actions"><span class="local-label"><i></i> 나만의 코딩 공간</span><button id="focus" aria-pressed="false">⛶ <span>집중 모드</span></button><button id="theme" title="테마 변경" aria-label="다크 모드로 전환">☾</button></div></header>
<main id="workspace">
<section class="panel editor-panel"><div class="editor-body"><pre id="lines" aria-hidden="true">1</pre><div class="code-area"><pre id="highlight" aria-hidden="true"></pre><textarea id="editor" aria-label="Java 코드 편집기" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea></div></div><footer class="editor-footer"><span id="cursor">Ln 1, Col 1</span><span>UTF-8 <span class="footer-sep">│</span> Spaces: 4 <span class="footer-sep">│</span> Java</span></footer></section>
<div id="splitter" role="separator" tabindex="0" aria-label="입출력 창 너비 조절" aria-orientation="vertical" aria-valuemin="240" aria-valuemax="600" aria-valuenow="340"></div>
<aside id="io-panel" class="panel"><div class="panel-heading"><span>입출력</span><button id="run" class="primary">▶ <span>실행</span><kbd>Ctrl ↵</kbd></button><button id="io-toggle" title="입출력 창 접기" aria-label="입출력 창 접기" aria-expanded="true">›</button></div><div class="io-content"><section class="input-section"><div class="section-heading"><label for="stdin">프로그램 입력 <small>stdin</small></label><button id="input-toggle" aria-expanded="true" title="입력 창 접기" aria-label="입력 창 접기">−</button></div><div id="input-body"><p class="hint">실행에 필요한 값을 미리 입력하세요.</p><textarea id="stdin" placeholder="예: 10 20" aria-label="프로그램 표준 입력" spellcheck="false"></textarea></div></section><section class="output-section"><div class="section-heading"><span>실행 결과 <small>output</small></span><button id="clear" title="실행 결과 지우기" aria-label="실행 결과 지우기">⌫</button></div><div id="output-empty"><span class="terminal-mark">&gt;_</span><strong>코드가 어떤 이야기를 할까요?</strong><p>실행 버튼을 눌러 결과를 확인하세요.</p><kbd>Ctrl + Enter</kbd></div><pre id="output" tabindex="0" aria-label="실행 결과" hidden></pre><div class="run-status" id="run-status" role="status">준비됨</div></section><p class="service-note">실행 시 코드와 입력이 Wandbox로 전송됩니다.</p></div></aside>
</main><footer class="bottom"><span><i></i> 코드를 쓸 준비가 되었어요.</span><span>작게 시작하고, 자유롭게 실험하세요.</span></footer>
<script src="app.js"></script></body></html>
